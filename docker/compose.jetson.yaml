# Optional release-matched Jetson GPU runtime. Build jetson-base first.
# This does not enable LAN or motion; combine go2-lan only after NIC verification.
services:
  monitor:
    image: hsgmv3:foxy-jetson-${L4T_TAG:?Set verified L4T_TAG r35.2.1 or r35.3.1}
    build:
      args:
        BASE_IMAGE: hsgm-jetson-base:${L4T_TAG:?Set verified L4T_TAG}
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
